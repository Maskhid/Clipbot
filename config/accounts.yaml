# Your brands and accounts. Add more brands later by copying the block below.
brands:

  peakgaminggt:
    niches: [GTA 6]
    caption_style: hype          # hype | funny | chill | news
    hashtags: ["#GTA6", "#gaming", "#gamingclips"]
    watermark: "@peakgamingGT"   # text shown on every clip
    accounts:
      - id: peakgaminggt_yt
        platform: youtube
        daily_cap: 6
        overflow: manual
        posts_per_day: 8
        windows: ["10:15-13:00", "16:00-23:00"]
        timezone: Africa/Lagos
      - id: peakgaminggt_tt
        platform: tiktok
        handle: "@peak.gaminggt"
        tiktok_mode: inbox
        daily_cap: 10
        posts_per_day: 8
        windows: ["10:15-13:00", "16:00-23:00"]
        timezone: Africa/Lagos
      - id: peakgaminggt_ig
        platform: instagram
        handle: "@peak.gaminggt"
        page: "Peak Gaming"
        posts_per_day: 8
        windows: ["10:15-13:00", "16:00-23:00"]
        timezone: Africa/Lagos
      - id: peakgaminggt_fb
        platform: facebook
        page: "Peak Gaming"
        posts_per_day: 8
        windows: ["10:15-13:00", "16:00-23:00"]
        timezone: Africa/Lagos
        
  lhm:
    niches: [podcast]
    caption_style: relatable podcast
    hashtags: ["#lethimmansplain", "#podcast"]
    accounts:
      - id: lhm_ig
        platform: instagram
        handle: "@lhmclips2"
        page: "Lhmclips"
        enabled: true
        posts_per_day: 3
        windows: ["11:00-14:00", "18:00-22:00"]
        timezone: America/New_York
      - id: lhm_tt
        platform: tiktok
        handle: "@lhmclips.tt"
        tiktok_mode: inbox
        enabled: true
        posts_per_day: 3
        windows: ["11:00-14:00"]
        timezone: America/New_York
      - id: lhm_yt
        platform: youtube
        handle: "@lethimmansplainclips"
        mode: manual
        enabled: true
        posts_per_day: 3
        windows: ["11:00-14:00"]
        timezone: America/New_York
  survival:
    niches: [survival stories]
    caption_style: story
    hashtags: ["#survival", "#story", "#animation"]
    accounts:
      - {id: survival_ig, platform: instagram, handle: "@survivethis.ig", page: "Survive This", enabled: true, posts_per_day: 2, windows: ["18:00-21:00"], timezone: America/New_York}
      - {id: survival_yt, platform: youtube, mode: manual, enabled: true, posts_per_day: 2, windows: ["11:00-14:00"], timezone: America/New_York}

  mysteries:
    niches: [ocean and space mysteries]
    caption_style: story
    hashtags: ["#mystery", "#ocean", "#space"]
    accounts:
      - {id: mysteries_ig, platform: instagram, handle: "@deepunknown.ig", page: "Deep Unknown", enabled: true, posts_per_day: 2, windows: ["18:00-21:00"], timezone: America/New_York}
      - {id: mysteries_yt, platform: youtube, mode: manual, enabled: true, posts_per_day: 2, windows: ["11:00-14:00"], timezone: America/New_York}

  creepy:
    niches: [creepy stories]
    caption_style: story
    hashtags: ["#scarystories", "#creepy", "#horrorstory"]
    accounts:
      - {id: creepy_ig, platform: instagram, handle: "@aftermidnight.igg", page: "After Midnight", enabled: true, posts_per_day: 2, windows: ["19:00-22:00"], timezone: America/New_York}
      - {id: creepy_yt, platform: youtube, mode: manual, enabled: true, posts_per_day: 2, windows: ["11:00-14:00"], timezone: America/New_York}
